
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <script src="/static/main.js?v=20261020"></script>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>بازیابی رمز عبور — خیام</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/khayyam.css?v=20261020">
  <link rel="stylesheet" href="/static/auth.css?v=20261020">
</head>
<body class="auth-body">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="mark" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 34V19C8 10.5 13 6 20 6s12 4.5 12 13v15"/><path d="M14 34V21c0-4 2.5-6.5 6-6.5s6 2.5 6 6.5v13"/><path d="M6 34h28"/></g></symbol></svg>
  <div class="auth-bg" aria-hidden="true"></div>
  <nav class="auth-nav">
    <a href="/" class="logo">
      <svg class="logo-mark" aria-hidden="true"><use href="#mark"/></svg>
      <span class="logo-text">خیام</span>
    </a>
    <a href="/login" class="auth-nav-link">ورود</a>
  </nav>

  <main class="auth-main">
    <section class="auth-card">
      <div class="auth-heading">
        <div class="auth-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 7 8.5 6.5L20.5 7"/></svg></div>
        <h1>بازیابی رمز عبور</h1>
        <p>
          آدرس ایمیل حساب خود را وارد کنید.
          لینک بازیابی برای شما ارسال خواهد شد.
        </p>
      </div>

      <div id="notice" class="auth-notice"
           role="status" aria-live="polite"></div>

      <form id="forgot-form">
        <div class="auth-field">
          <label class="auth-label" for="email">
            آدرس ایمیل
          </label>
          <input class="auth-input" id="email"
                 type="email" autocomplete="email"
                 placeholder="example@gmail.com"
                 required maxlength="150">
        </div>

        <button class="auth-button" id="submit-btn"
                type="submit">
          ارسال لینک بازیابی
        </button>
      </form>

      <div class="auth-footer">
        <a href="/login">بازگشت به صفحه ورود</a>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('forgot-form');
    const button = document.getElementById('submit-btn');
    const notice = document.getElementById('notice');

    function showNotice(text, type) {
      notice.textContent = text;
      notice.className = 'auth-notice visible ' + type;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = 'در حال ارسال...';
      notice.className = 'auth-notice';

      try {
        const response = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            email: document.getElementById('email').value.trim()
          })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          showNotice(
            data.error || 'ارسال درخواست ناموفق بود.',
            'error'
          );
        } else {
          showNotice(
            data.message ||
            'اگر ایمیل ثبت شده باشد، لینک بازیابی ارسال می‌شود.',
            'success'
          );
        }
      } catch (error) {
        showNotice('ارتباط با سرور برقرار نشد.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'ارسال لینک بازیابی';
      }
    });
  </script>
</body>
</html>
