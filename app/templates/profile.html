<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="theme-color" content="#0a2b23">
  <script src="/static/main.js?v=20261020"></script>
  <title>پروفایل — خیام</title>
  <link rel="preload" href="/static/fonts/vazirmatn-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/khayyam.css?v=20261020">
  <link rel="stylesheet" href="/static/light.css?v=20261020">
</head>
<body class="light on-light">

<header class="lt-nav">
  <div class="lt-wrap lt-nav-in">
    <a href="/" class="logo" aria-label="خیام"><svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 34V19C8 10.5 13 6 20 6s12 4.5 12 13v15"/><path d="M14 34V21c0-4 2.5-6.5 6-6.5s6 2.5 6 6.5v13"/><path d="M6 34h28"/></g></svg><span class="logo-text">خیام</span></a>
    <nav class="lt-links" aria-label="بخش‌ها" id="nav-links">
      <a class="lt-link" href="/chat">گفتگو</a>
      <a class="lt-link" href="/tutor">استاد</a>
      <a class="lt-link" href="/pricing">پلان‌ها</a>
    </nav>
    <div class="lt-auth"><a href="/logout" class="btn btn-ghost">خروج</a></div>
  </div>
</header>

<section class="band pf-hero">
  <div class="lt-wrap">
    <div class="pf-user" id="user-card">
      <div class="pf-avatar" id="user-avatar" aria-hidden="true"></div>
      <div>
        <div class="pf-name" id="user-name">در حال بارگذاری…</div>
        <div class="pf-detail" id="user-detail"></div>
      </div>
      <span class="pf-badge" id="user-badge">رایگان</span>
    </div>
  </div>
</section>

<main class="lt-wrap pf-main">
  <div class="pf-plans" id="plans-card"><div class="loading">در حال بارگذاری…</div></div>

  <h2 class="pf-title">گفتگوهای ذخیره‌شده</h2>
  <div class="conv-list" id="conv-list"><div class="loading">در حال بارگذاری…</div></div>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a href="/" class="bottom-tab">
      <span class="tab-icon"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7v8.500a.5.5 0 0 1-.5.500H15v-5.500H9V20H4.500a.5.5 0 0 1-.5-.5V11Z"/></g></svg></span>
      <span class="tab-label">خانه</span>
    </a>
    <a href="/chat" class="bottom-tab">
      <span class="tab-icon"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-11.600 7.100L4 20l1-4.200A8 8 0 1 1 20 12Z"/></g></svg></span>
      <span class="tab-label">چت</span>
    </a>
    <a href="/tutor" class="bottom-tab">
      <span class="tab-icon"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m2.500 9 9.500-4.500L21.500 9 12 13.500 2.500 9Z"/><path d="M6.500 11.200v4.300c0 1.200 2.500 2.600 5.500 2.600s5.500-1.400 5.500-2.600v-4.300"/></g></svg></span>
      <span class="tab-label">بیاموز</span>
    </a>
    <a href="/profile" class="bottom-tab active">
      <span class="tab-icon"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.500" r="3.600"/><path d="M4.500 20c.9-3.600 3.900-5.500 7.500-5.500s6.600 1.900 7.500 5.500"/></g></svg></span>
      <span class="tab-label">پروفایل</span>
    </a>
  </div>
</nav>

<script>
  const ICON_CHAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12Z"/><path d="M9 11h6M9 14.5h3.5"/></svg>';
  const ICON_CAP  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2.5 9 9.5-4.5L21.5 9 12 13.5 2.5 9Z"/><path d="M6.5 11.2v4.3c0 1.2 2.5 2.6 5.5 2.6s5.5-1.4 5.5-2.6v-4.3M21.5 9v5"/></svg>';
  const ICON_X    = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';

  async function checkAdminLink() {
    try {
      const data = await (await fetch('/api/me')).json();
      if (data.is_admin) {
        const a = document.createElement('a');
        a.href = '/admin'; a.className = 'lt-link'; a.textContent = 'مدیریت';
        document.getElementById('nav-links').appendChild(a);
      }
    } catch (e) {}
  }
  checkAdminLink();

  function formatDate(iso) {
    // the server sends UTC without a timezone marker; add Z so the browser converts correctly
    const utcString = iso.endsWith('Z') ? iso : iso + 'Z';
    const d = new Date(utcString), diff = new Date() - d;
    if (diff < 60000)    return 'همین الان';
    if (diff < 3600000)  return Math.floor(diff / 60000) + ' دقیقه پیش';
    if (diff < 86400000) return Math.floor(diff / 3600000) + ' ساعت پیش';
    return d.toLocaleDateString('fa-AF');
  }

  async function loadUser() {
    const res  = await fetch('/api/me');
    const data = await res.json();
    if (!data.logged_in) { window.location.href = '/login'; return; }
    document.getElementById('user-avatar').textContent = data.username.charAt(0).toUpperCase();
    document.getElementById('user-name').textContent   = data.username;
    const detail = [];
    if (data.email) detail.push(data.email);
    if (data.phone) detail.push(data.phone);
    document.getElementById('user-detail').textContent = detail.join(' · ');
    renderPlans(data);
  }

  const PLAN_LABELS = { free: 'رایگان', basic: 'پایه', pro: 'حرفه‌ای', premium: 'پریمیوم', tutor_pro: 'استاد حرفه‌ای' };

  function expiryHtml(iso) {
    if (!iso) return '';
    const d    = new Date(iso.endsWith('Z') ? iso : iso + 'Z');
    const days = Math.ceil((d - new Date()) / 86400000);
    const date = d.toLocaleDateString('fa-AF');
    if (days <= 0) return '<span class="pl-exp soon">امروز تمام می‌شود</span>';
    return `<span class="pl-exp${days <= 3 ? ' soon' : ''}">تا ${escapeHtml(date)} · ${days} روز مانده</span>`;
  }

  function usageHtml(summary) {
    if (!summary || !summary.length) return '';
    return summary.map(t => {
      const pct = t.limit ? Math.min(100, Math.round((t.used / t.limit) * 100)) : 0;
      const per = t.period === 'daily' ? 'امروز' : 'این ماه';
      return `<div class="usage-line">${per}: ${t.used.toLocaleString('fa-AF')} از ${t.limit.toLocaleString('fa-AF')}
        <div class="usage-track"><div class="usage-fill${pct >= 90 ? ' hot' : ''}" style="width:${pct}%"></div></div></div>`;
    }).join('');
  }

  async function renderPlans(me) {
    const card = document.getElementById('plans-card');
    document.getElementById('user-badge').textContent = PLAN_LABELS[me.chat_plan] || me.chat_plan;
    let usage = null;
    try { usage = await (await fetch('/api/usage')).json(); } catch (e) {}
    const chatName  = escapeHtml(PLAN_LABELS[me.chat_plan]  || me.chat_plan);
    const tutorName = escapeHtml(PLAN_LABELS[me.tutor_plan] || me.tutor_plan);
    card.innerHTML = `
      <section class="pl">
        <div class="pl-top"><span class="pl-ico">${ICON_CHAT}</span><div><div class="pl-kind">پلان گفتگو</div><div class="pl-name">${chatName}</div></div></div>
        ${me.chat_plan !== 'free' ? expiryHtml(me.chat_plan_expires_at) : ''}
        ${usage ? usageHtml(usage.summary.slice(0, 2)) : ''}
        <div class="pl-actions"><a href="/pricing#contact">تمدید یا ارتقای پلان ←</a></div>
      </section>
      <section class="pl gold">
        <div class="pl-top"><span class="pl-ico">${ICON_CAP}</span><div><div class="pl-kind">پلان استاد</div><div class="pl-name">${tutorName}</div></div></div>
        ${me.tutor_plan !== 'free' ? expiryHtml(me.tutor_plan_expires_at) : ''}
        ${usage ? usageHtml(usage.tutor_summary.slice(0, 1)) : ''}
        <div class="pl-actions"><a href="/pricing#contact">تمدید یا ارتقای پلان ←</a></div>
      </section>`;
  }

  async function loadConversations() {
    const list = document.getElementById('conv-list');
    try {
      const res   = await fetch('/api/conversations');
      const convs = await res.json();
      if (convs.length === 0) {
        list.innerHTML = `<div class="empty-state">هنوز گفتگویی ندارید.<br/><a href="/chat">اولین گفتگوی خود را شروع کنید ←</a></div>`;
        return;
      }
      list.innerHTML = '';
      convs.forEach((conv, i) => {
        const div = document.createElement('a');
        div.className = 'conv-card';
        div.href      = `/chat?conv=${conv.id}`;
        div.style.animationDelay = (i * 0.05) + 's';
        div.innerHTML = `
          <div class="conv-icon">${ICON_CHAT}</div>
          <div class="conv-body">
            <div class="conv-title">${escapeHtml(conv.title)}</div>
            <div class="conv-date">${formatDate(conv.updated_at)}</div>
          </div>
          <button class="conv-del" type="button" aria-label="حذف گفتگو" onclick="deleteConv(event, ${conv.id})">${ICON_X}</button>`;
        list.appendChild(div);
      });
    } catch (err) {
      list.innerHTML = '<div class="empty-state">بارگذاری گفتگوها ناموفق بود. صفحه را تازه کنید.</div>';
    }
  }

  async function deleteConv(e, id) {
    e.preventDefault(); e.stopPropagation();
    await fetch(`/api/conversations/${id}`, { method: 'DELETE' });
    loadConversations();
  }

  loadUser();
  loadConversations();
</script>
</body>
</html>
