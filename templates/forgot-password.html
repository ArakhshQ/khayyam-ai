<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>بازیابی رمز عبور — خیام</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Vazirmatn', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    nav {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 56px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .logo-mark {
      width: 30px; height: 30px; border: 1.5px solid var(--gold);
      border-radius: 7px; display: flex; align-items: center;
      justify-content: center; font-size: 14px; font-weight: 700; color: var(--gold);
    }
    .logo-text { font-size: 16px; font-weight: 700; color: var(--gold); }
    .nav-link {
      color: var(--text-dim); text-decoration: none; font-size: 13px;
      padding: 5px 12px; border-radius: 7px; border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .nav-link:hover { color: var(--text); background: var(--surface2); }
    .page {
      position: relative; z-index: 1; flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 16px;
    }
    .card {
      width: 100%; max-width: 400px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 36px 32px;
      animation: fadeUp 0.5s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-top { text-align: center; margin-bottom: 28px; }
    .card-top h1 { font-size: 22px; font-weight: 700; color: var(--gold); margin-bottom: 6px; }
    .card-top p  { font-size: 13px; color: var(--text-dim); line-height: 1.7; }
    .form-group  { margin-bottom: 18px; }
    .form-label  {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--text); margin-bottom: 8px;
    }
    .form-input {
      width: 100%; padding: 12px 14px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 9px; color: var(--text);
      font-family: 'Vazirmatn', sans-serif;
      font-size: 14px; font-weight: 500; outline: none; transition: border-color 0.2s; direction: ltr; text-align: right;
    }
    .form-input:focus { border-color: var(--gold-dim); }
    .form-input::placeholder { color: var(--text-dim); font-weight: 400; opacity: 0.75; }
    .submit-btn {
      width: 100%; padding: 13px;
      background: var(--gold); color: #0f0e0c;
      border: none; border-radius: 9px;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 15px; font-weight: 700;
      cursor: pointer; transition: all 0.2s; margin-top: 6px;
    }
    .submit-btn:hover { background: #e0bb60; transform: translateY(-1px); }
    .submit-btn:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; transform: none; }
    .error-box {
      background: var(--red); border: 1px solid #6a2a2a;
      border-radius: 8px; padding: 10px 14px;
      font-size: 13px; color: var(--red-lt);
      margin-bottom: 16px; display: none;
    }
    .success-box {
      background: var(--green); border: 1px solid #3a6a2a;
      border-radius: 8px; padding: 14px 16px;
      font-size: 13px; color: var(--green-lt);
      margin-bottom: 16px; display: none; line-height: 1.8;
    }
    .footer-link {
      text-align: center; margin-top: 20px;
      font-size: 13px; color: var(--text-dim);
    }
    .footer-link a { color: var(--gold); text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo">
      <div class="logo-mark">خ</div>
      <span class="logo-text">خیام</span>
    </a>
    <a href="/login" class="nav-link">ورود</a>
  </nav>

  <div class="page">
    <div class="card">
      <div class="card-top">
        <h1>بازیابی رمز عبور</h1>
        <p>ایمیل حساب خود را بنویسید تا لینک بازیابی برایتان ارسال شود</p>
      </div>

      <div id="error-box" class="error-box"></div>
      <div id="success-box" class="success-box"></div>

      <div id="form-wrap">
        <div class="form-group">
          <label class="form-label">ایمیل</label>
          <input class="form-input" type="email" id="email" placeholder="name@example.com" autocomplete="email"/>
        </div>

        <button class="submit-btn" id="submit-btn" onclick="submitForgot()">
          ارسال لینک بازیابی ←
        </button>
      </div>

      <div class="footer-link">
        رمز عبور یادتان آمد؟ <a href="/login">وارد شوید</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') submitForgot();
    });

    function showError(msg) {
      document.getElementById('error-box').textContent = msg;
      document.getElementById('error-box').style.display = 'block';
      document.getElementById('success-box').style.display = 'none';
    }

    async function submitForgot() {
      const email = document.getElementById('email').value.trim();
      if (!email) return showError('لطفاً ایمیل خود را بنویسید');

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'در حال ارسال...';

      try {
        const res  = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        document.getElementById('error-box').style.display = 'none';
        const successBox = document.getElementById('success-box');
        successBox.textContent = data.message;
        successBox.style.display = 'block';
        document.getElementById('form-wrap').style.display = 'none';
      } catch (err) {
        showError('خطای اتصال. دوباره امتحان کنید.');
        btn.disabled = false;
        btn.textContent = 'ارسال لینک بازیابی ←';
      }
    }
  </script>
</body>
</html>
