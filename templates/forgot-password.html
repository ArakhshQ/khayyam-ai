
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>بازیابی رمز عبور — خیام</title>

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="/static/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Vazirmatn', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .logo-mark {
      width: 30px;
      height: 30px;
      border: 1.5px solid var(--gold);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-weight: 700;
    }

    .logo-text {
      color: var(--gold);
      font-size: 16px;
      font-weight: 700;
    }

    .nav-link {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px 12px;
    }

    .nav-link:hover {
      color: var(--text);
      background: var(--surface2);
    }

    .page {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 16px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 36px 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      animation: fadeUp 0.45s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-top {
      text-align: center;
      margin-bottom: 28px;
    }

    .card-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }

    h1 {
      color: var(--gold);
      font-size: 22px;
      margin: 0 0 8px;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 13px;
      line-height: 1.9;
      margin: 0;
    }

    .form-label {
      display: block;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 7px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      direction: ltr;
      text-align: left;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--gold-dim);
    }

    .submit-btn {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: var(--gold);
      color: #0f0e0c;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: #e0bb60;
    }

    .submit-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.8;
    }

    .message.success {
      display: block;
      background: var(--surface2);
      border: 1px solid var(--gold-dim);
      color: var(--text);
    }

    .message.error {
      display: block;
      background: var(--surface2);
      border: 1px solid #a84a4a;
      color: var(--text);
    }

    .footer-link {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
    }

    .footer-link a {
      color: var(--gold);
      text-decoration: none;
    }

    .footer-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      nav {
        padding: 0 16px;
      }

      .card {
        padding: 28px 22px;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a href="/" class="logo">
      <div class="logo-mark">خ</div>
      <span class="logo-text">خیام</span>
    </a>

    <a href="/login" class="nav-link">
      ورود به حساب
    </a>
  </nav>

  <main class="page">
    <section class="card">
      <div class="card-top">
        <div class="card-icon" aria-hidden="true">✉️</div>

        <h1>بازیابی رمز عبور</h1>

        <p class="subtitle">
          رمز عبور خود را فراموش کرده‌اید؟
          ایمیل حساب خود را وارد کنید تا لینک
          بازیابی رمز عبور برایتان ارسال شود.
        </p>
      </div>

      <form id="reset-form">
        <label class="form-label" for="email">
          آدرس ایمیل
        </label>

        <input
          class="form-input"
          type="email"
          id="email"
          name="email"
          placeholder="example@gmail.com"
          autocomplete="email"
          required
          maxlength="150"
        >

        <button
          class="submit-btn"
          id="submit-btn"
          type="submit">
          ارسال لینک بازیابی
        </button>
      </form>

      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite">
      </div>

      <div class="footer-link">
        <a href="/login">
          بازگشت به صفحه ورود ←
        </a>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('reset-form');
    const button = document.getElementById('submit-btn');
    const message = document.getElementById('message');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'message ' + type;
    }

    form.addEventListener('submit', async function(event) {
      event.preventDefault();

      button.disabled = true;
      button.textContent = 'در حال ارسال...';
      message.className = 'message';
      message.textContent = '';

      try {
        const response = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: document.getElementById('email').value
          })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          showMessage(
            data.error || 'خطایی رخ داد. دوباره تلاش کنید.',
            'error'
          );
          return;
        }

        showMessage(
          data.message ||
          'اگر این ایمیل ثبت شده باشد، لینک بازیابی ارسال خواهد شد.',
          'success'
        );

      } catch (error) {
        console.error('Password recovery request failed:', error);

        showMessage(
          'ارتباط با سرور برقرار نشد. لطفاً دوباره تلاش کنید.',
          'error'
        );

      } finally {
        button.disabled = false;
        button.textContent = 'ارسال لینک بازیابی';
      }
    });
  </script>
</body>
</html>

</body>
</html>
