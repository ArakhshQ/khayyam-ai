<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تعیین رمز عبور جدید — خیام</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Vazirmatn', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    nav {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 56px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .logo-mark {
      width: 30px; height: 30px; border: 1.5px solid var(--gold);
      border-radius: 7px; display: flex; align-items: center;
      justify-content: center; font-size: 14px; font-weight: 700; color: var(--gold);
    }
    .logo-text { font-size: 16px; font-weight: 700; color: var(--gold); }
    .page {
      position: relative; z-index: 1; flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 16px;
    }
    .card {
      width: 100%; max-width: 400px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 36px 32px;
      animation: fadeUp 0.5s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-top { text-align: center; margin-bottom: 28px; }
    .card-top h1 { font-size: 22px; font-weight: 700; color: var(--gold); margin-bottom: 6px; }
    .card-top p  { font-size: 13px; color: var(--text-dim); line-height: 1.7; }
    .form-group  { margin-bottom: 18px; }
    .form-label  {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--text); margin-bottom: 8px;
    }
    .form-input {
      width: 100%; padding: 12px 14px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 9px; color: var(--text);
      font-family: 'Vazirmatn', sans-serif;
      font-size: 14px; font-weight: 500; outline: none; transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--gold-dim); }
    .form-input::placeholder { color: var(--text-dim); font-weight: 400; opacity: 0.75; }
    .password-hint { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
    .submit-btn {
      width: 100%; padding: 13px;
      background: var(--gold); color: #0f0e0c;
      border: none; border-radius: 9px;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 15px; font-weight: 700;
      cursor: pointer; transition: all 0.2s; margin-top: 6px;
    }
    .submit-btn:hover { background: #e0bb60; transform: translateY(-1px); }
    .submit-btn:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; transform: none; }
    .error-box {
      background: var(--red); border: 1px solid #6a2a2a;
      border-radius: 8px; padding: 10px 14px;
      font-size: 13px; color: var(--red-lt);
      margin-bottom: 16px; display: none;
    }
    .success-box {
      background: var(--green); border: 1px solid #3a6a2a;
      border-radius: 8px; padding: 14px 16px;
      font-size: 13px; color: var(--green-lt);
      margin-bottom: 16px; display: none; line-height: 1.8;
    }
    .footer-link {
      text-align: center; margin-top: 20px;
      font-size: 13px; color: var(--text-dim);
    }
    .footer-link a { color: var(--gold); text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
    .no-token-box {
      text-align: center; padding: 8px 0 4px; color: var(--text-dim); font-size: 13px; line-height: 1.9;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo">
      <div class="logo-mark">خ</div>
      <span class="logo-text">خیام</span>
    </a>
  </nav>

  <div class="page">
    <div class="card">
      <div class="card-top">
        <h1>تعیین رمز عبور جدید</h1>
        <p>رمز عبور تازه خود را وارد کنید</p>
      </div>

      <div id="error-box" class="error-box"></div>
      <div id="success-box" class="success-box"></div>

      {% if token %}
      <div id="form-wrap">
        <div class="form-group">
          <label class="form-label">رمز عبور جدید</label>
          <input class="form-input" type="password" id="password" placeholder="رمز عبور تازه بسازید" autocomplete="new-password"/>
          <div class="password-hint">حداقل ۶ حرف</div>
        </div>

        <div class="form-group">
          <label class="form-label">تکرار رمز عبور جدید</label>
          <input class="form-input" type="password" id="password2" placeholder="رمز عبور را دوباره بنویسید" autocomplete="new-password"/>
        </div>

        <button class="submit-btn" id="submit-btn" onclick="submitReset()">
          تعیین رمز عبور ←
        </button>
      </div>
      {% else %}
      <div class="no-token-box">
        لینک نامعتبر است.<br/>
        <a href="/forgot-password" style="color:var(--gold);text-decoration:none;">یک لینک جدید درخواست کنید</a>
      </div>
      {% endif %}

      <div class="footer-link">
        <a href="/login">بازگشت به صفحه ورود</a>
      </div>
    </div>
  </div>

  <script>
    const token = {{ token|tojson }};

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') submitReset();
    });

    function showError(msg) {
      document.getElementById('error-box').textContent = msg;
      document.getElementById('error-box').style.display = 'block';
      document.getElementById('success-box').style.display = 'none';
    }

    async function submitReset() {
      const password  = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;

      if (password.length < 6) return showError('رمز عبور باید حداقل ۶ حرف باشد');
      if (password !== password2) return showError('رمزهای عبور یکسان نیستند');

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'در حال ثبت...';

      try {
        const res  = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById('error-box').style.display = 'none';
          const successBox = document.getElementById('success-box');
          successBox.textContent = 'رمز عبور شما تغییر کرد. در حال انتقال...';
          successBox.style.display = 'block';
          document.getElementById('form-wrap').style.display = 'none';
          setTimeout(() => window.location.href = '/chat', 1200);
        } else {
          showError(data.error);
          btn.disabled = false;
          btn.textContent = 'تعیین رمز عبور ←';
        }
      } catch (err) {
        showError('خطای اتصال. دوباره امتحان کنید.');
        btn.disabled = false;
        btn.textContent = 'تعیین رمز عبور ←';
      }
    }
  </script>
</body>
</html>
