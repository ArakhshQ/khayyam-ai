
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <script src="/static/main.js?v=2"></script>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>ورود — خیام</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body class="auth-body">
  <nav class="auth-nav">
    <a href="/" class="logo">
      <span class="logo-mark">خ</span>
      <span class="logo-text">خیام</span>
    </a>
    <a href="/register" class="auth-nav-link">
      ایجاد حساب
    </a>
  </nav>

  <main class="auth-main">
    <section class="auth-card">
      <div class="auth-heading">
        <div class="auth-icon" aria-hidden="true">✦</div>
        <h1>خوش آمدید</h1>
        <p>برای ادامه وارد حساب خیام خود شوید.</p>
      </div>

      <div id="notice" class="auth-notice"
           role="status" aria-live="polite"></div>

      <form id="login-form">
        <div class="auth-field">
          <label class="auth-label" for="email">
            آدرس ایمیل
          </label>
          <input class="auth-input" id="email"
                 type="email" autocomplete="email"
                 placeholder="example@gmail.com"
                 required>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="password">
            رمز عبور
          </label>
          <input class="auth-input" id="password"
                 type="password"
                 autocomplete="current-password"
                 placeholder="رمز عبور خود را وارد کنید"
                 required>
        </div>

        <div class="auth-help-row">
          <a class="auth-text-link"
             href="/forgot-password">
            رمز عبور را فراموش کرده‌اید؟
          </a>
        </div>

        <button class="auth-button" id="submit-btn"
                type="submit">
          ورود به حساب
        </button>
      </form>

      <div class="auth-footer">
        حساب ندارید؟
        <a href="/register">ثبت‌نام کنید</a>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const button = document.getElementById('submit-btn');
    const notice = document.getElementById('notice');

    function showNotice(message, type = 'error') {
      notice.textContent = message;
      notice.className = 'auth-notice visible ' + type;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      notice.className = 'auth-notice';
      button.disabled = true;
      button.textContent = 'در حال ورود...';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });

        const data = await response.json();

        if (data.success) {
          window.location.href = '/chat';
          return;
        }

        if (data.verification_required) {
          window.location.href = '/check-email';
          return;
        }

        showNotice(data.error || 'ورود ناموفق بود.');
      } catch (error) {
        showNotice('ارتباط با سرور برقرار نشد.');
      } finally {
        button.disabled = false;
        button.textContent = 'ورود به حساب';
      }
    });
  </script>
</body>
</html>
