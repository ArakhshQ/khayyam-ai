<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>آزمایش صدا — خیام</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  {{ csrf_meta_tag() }}
  <script src="/static/main.js"></script>
  <style>
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Vazirmatn', sans-serif;
      min-height: 100vh; padding: 40px 16px;
    }
    .card {
      max-width: 520px; margin: 0 auto;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 30px;
    }
    h2 { color: var(--gold); font-size: 19px; margin-bottom: 6px; }
    .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 22px; line-height: 1.8; }
    textarea {
      width: 100%; padding: 12px 14px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 9px; color: var(--text);
      font-family: 'Vazirmatn', sans-serif; font-size: 15px;
      min-height: 90px; margin-bottom: 14px; outline: none; resize: vertical;
    }
    textarea:focus { border-color: var(--gold-dim); }
    button {
      padding: 12px 28px; background: var(--gold); color: #0f0e0c;
      border: none; border-radius: 9px; font-weight: 700; cursor: pointer;
      font-family: 'Vazirmatn', sans-serif; font-size: 14px;
    }
    button:hover:not(:disabled) { background: #e0bb60; }
    button:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }
    audio { display: block; width: 100%; margin-top: 16px; }
    #status {
      margin-top: 18px; font-size: 12px; color: var(--text-dim);
      white-space: pre-wrap; direction: ltr; text-align: left;
      max-height: 220px; overflow-y: auto; background: var(--surface2);
      border-radius: 9px; padding: 12px; font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>آزمایش صدای خیام</h2>
    <p class="subtitle">
      این یک صفحه آزمایشی است (فقط برای ادمین) — یک جمله به دری بنویسید و ببینید
      مدل صوتی چطور آن را می‌خواند. این صفحه بخشی از خیام نیست و بعداً حذف می‌شود.
    </p>
    <textarea id="phrase">سلام، من خیام هستم. چطور می‌توانم امروز به شما کمک کنم؟</textarea>
    <button id="speak-btn" onclick="startVoiceTest()">پخش صدا ←</button>
    <audio id="player" autoplay></audio>
    <div id="status"></div>
  </div>

  <script>
    let pc = null;
    let dc = null;

    function log(msg) {
      const el = document.getElementById('status');
      el.textContent += msg + '\n';
      el.scrollTop = el.scrollHeight;
      console.log(msg);
    }

    async function startVoiceTest() {
      const btn = document.getElementById('speak-btn');
      btn.disabled = true;
      document.getElementById('status').textContent = '';

      const phrase = document.getElementById('phrase').value.trim();
      if (!phrase) {
        log('لطفاً یک جمله بنویسید');
        btn.disabled = false;
        return;
      }

      if (pc) { pc.close(); pc = null; }

      try {
        log('در حال دریافت توکن...');
        const tokenRes  = await fetch('/api/voice-test/token', { method: 'POST' });
        const tokenData = await tokenRes.json();

        if (!tokenData.success) {
          log('خطا در دریافت توکن:\n' + tokenData.error);
          btn.disabled = false;
          return;
        }
        const clientSecret = tokenData.client_secret;
        log('توکن دریافت شد.');

        pc = new RTCPeerConnection();

        pc.ontrack = (event) => {
          log('در حال دریافت صدا...');
          document.getElementById('player').srcObject = event.streams[0];
        };

        pc.addTransceiver('audio', { direction: 'recvonly' });

        dc = pc.createDataChannel('oai-events');

        dc.addEventListener('open', () => {
          log('اتصال داده برقرار شد. در حال ارسال متن...');
          dc.send(JSON.stringify({
            type: 'conversation.item.create',
            item: {
              type: 'message',
              role: 'user',
              content: [{ type: 'input_text', text: phrase }]
            }
          }));
          dc.send(JSON.stringify({
            type: 'response.create',
            response: { modalities: ['audio', 'text'] }
          }));
        });

        dc.addEventListener('message', (e) => {
          let evt;
          try { evt = JSON.parse(e.data); } catch { return; }
          if (evt.type === 'response.done') {
            log('پاسخ کامل شد.');
            btn.disabled = false;
          } else if (evt.type === 'error') {
            log('خطای OpenAI:\n' + JSON.stringify(evt, null, 2));
            btn.disabled = false;
          }
        });

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        log('در حال اتصال به OpenAI...');
        const sdpResponse = await fetch('https://api.openai.com/v1/realtime/calls', {
          method: 'POST',
          body: offer.sdp,
          headers: {
            'Authorization': `Bearer ${clientSecret}`,
            'Content-Type': 'application/sdp'
          }
        });

        if (!sdpResponse.ok) {
          const errText = await sdpResponse.text();
          log(`اتصال ناموفق (${sdpResponse.status}):\n` + errText);
          btn.disabled = false;
          return;
        }

        const answerSdp = await sdpResponse.text();
        await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
        log('اتصال WebRTC برقرار شد. در انتظار صدا...');

      } catch (err) {
        log('خطا: ' + err.message);
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
