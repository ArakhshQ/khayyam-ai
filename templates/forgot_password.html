
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>بازیابی رمز عبور — خیام</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body class="auth-body">
  <nav class="auth-nav">
    <a href="/" class="logo">
      <span class="logo-mark">خ</span>
      <span class="logo-text">خیام</span>
    </a>
    <a href="/login" class="auth-nav-link">ورود</a>
  </nav>

  <main class="auth-main">
    <section class="auth-card">
      <div class="auth-heading">
        <div class="auth-icon" aria-hidden="true">✉</div>
        <h1>بازیابی رمز عبور</h1>
        <p>
          آدرس ایمیل حساب خود را وارد کنید.
          لینک بازیابی برای شما ارسال خواهد شد.
        </p>
      </div>

      <div id="notice" class="auth-notice"
           role="status" aria-live="polite"></div>

      <form id="forgot-form">
        <div class="auth-field">
          <label class="auth-label" for="email">
            آدرس ایمیل
          </label>
          <input class="auth-input" id="email"
                 type="email" autocomplete="email"
                 placeholder="example@gmail.com"
                 required maxlength="150">
        </div>

        <button class="auth-button" id="submit-btn"
                type="submit">
          ارسال لینک بازیابی
        </button>
      </form>

      <div class="auth-footer">
        <a href="/login">بازگشت به صفحه ورود</a>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('forgot-form');
    const button = document.getElementById('submit-btn');
    const notice = document.getElementById('notice');

    function showNotice(text, type) {
      notice.textContent = text;
      notice.className = 'auth-notice visible ' + type;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = 'در حال ارسال...';
      notice.className = 'auth-notice';

      try {
        const response = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            email: document.getElementById('email').value.trim()
          })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          showNotice(
            data.error || 'ارسال درخواست ناموفق بود.',
            'error'
          );
        } else {
          showNotice(
            data.message ||
            'اگر ایمیل ثبت شده باشد، لینک بازیابی ارسال می‌شود.',
            'success'
          );
        }
      } catch (error) {
        showNotice('ارتباط با سرور برقرار نشد.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'ارسال لینک بازیابی';
      }
    });
  </script>
</body>
</html>
