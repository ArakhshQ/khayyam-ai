<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خیام AI</title><style>body{font-family:Tahoma,Arial;background:#101827;color:#f4f6fb;display:grid;place-items:center;min-height:95vh}main{width:min(92vw,440px);padding:32px;border:1px solid #42516b;border-radius:18px;background:#1b2740}input,button{box-sizing:border-box;width:100%;padding:13px;margin:9px 0;border-radius:9px;border:1px solid #75809a;font-size:16px}button{background:#6e88ee;color:white;cursor:pointer}a{color:#b6c8ff}#message{min-height:28px}</style><main><h2>بازیابی رمز عبور</h2><p>ایمیل حساب خود را وارد کنید.</p><form id="form"><input id="email" type="email" required placeholder="ایمیل" autocomplete="email"><button>ارسال لینک بازیابی</button></form><p id="message"></p><a href="/login">بازگشت به ورود</a><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const r=await fetch('/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value})});const d=await r.json();document.getElementById('message').textContent=d.message||d.error||'خطا';}catch(e){document.getElementById('message').textContent='خطای ارتباط';}finally{b.disabled=false;}};</script></main></html>
