
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>رمز عبور جدید — خیام</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body class="auth-body">
  <nav class="auth-nav">
    <a href="/" class="logo">
      <span class="logo-mark">خ</span>
      <span class="logo-text">خیام</span>
    </a>
    <a href="/login" class="auth-nav-link">ورود</a>
  </nav>

  <main class="auth-main">
    <section class="auth-card">
      <div class="auth-heading">
        <div class="auth-icon" aria-hidden="true">✦</div>
        <h1>تعیین رمز عبور جدید</h1>
        <p>برای حساب خود یک رمز عبور امن انتخاب کنید.</p>
      </div>

      <div id="notice" class="auth-notice"
           role="status" aria-live="polite"></div>

      {% if valid %}
      <form id="reset-form">
        <div class="auth-field">
          <label class="auth-label" for="password">
            رمز عبور جدید
          </label>
          <input class="auth-input" id="password"
                 type="password"
                 autocomplete="new-password"
                 minlength="8" maxlength="128"
                 required>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="confirm">
            تکرار رمز عبور
          </label>
          <input class="auth-input" id="confirm"
                 type="password"
                 autocomplete="new-password"
                 minlength="8" maxlength="128"
                 required>
        </div>

        <button class="auth-button" id="submit-btn"
                type="submit">
          ذخیره رمز عبور جدید
        </button>
      </form>
      {% else %}
      <div class="auth-notice visible error">
        این لینک نامعتبر است یا اعتبار آن به پایان رسیده است.
      </div>
      <a class="auth-button"
         style="display:block;text-align:center;text-decoration:none"
         href="/forgot-password">
        درخواست لینک جدید
      </a>
      {% endif %}

      <div class="auth-footer">
        <a href="/login">بازگشت به ورود</a>
      </div>
    </section>
  </main>

  {% if valid %}
  <script>
    const form = document.getElementById('reset-form');
    const notice = document.getElementById('notice');
    const button = document.getElementById('submit-btn');
    const token = {{ token|tojson }};

    function showNotice(message, type) {
      notice.textContent = message;
      notice.className = 'auth-notice visible ' + type;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password !== confirm) {
        showNotice('رمزهای عبور یکسان نیستند.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'در حال ذخیره...';

      try {
        const response = await fetch('/api/reset-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({token, password})
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          showNotice(
            data.error || 'تغییر رمز عبور ناموفق بود.',
            'error'
          );
          return;
        }

        form.style.display = 'none';
        showNotice(
          'رمز عبور با موفقیت تغییر کرد. اکنون می‌توانید وارد شوید.',
          'success'
        );
      } catch (error) {
        showNotice('ارتباط با سرور برقرار نشد.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'ذخیره رمز عبور جدید';
      }
    });
  </script>
  {% endif %}
</body>
</html>
