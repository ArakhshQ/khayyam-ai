<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خیام AI</title><style>body{font-family:Tahoma,Arial;background:#101827;color:#f4f6fb;display:grid;place-items:center;min-height:95vh}main{width:min(92vw,440px);padding:32px;border:1px solid #42516b;border-radius:18px;background:#1b2740}input,button{box-sizing:border-box;width:100%;padding:13px;margin:9px 0;border-radius:9px;border:1px solid #75809a;font-size:16px}button{background:#6e88ee;color:white;cursor:pointer}a{color:#b6c8ff}#message{min-height:28px}</style><main><h2>تعیین رمز عبور جدید</h2>{% if valid %}<form id="form"><input type="password" id="password" required minlength="8" maxlength="128" placeholder="رمز جدید (حداقل ۸ نویسه)" autocomplete="new-password"><input type="password" id="confirm" required placeholder="تکرار رمز جدید" autocomplete="new-password"><button>ذخیره رمز جدید</button></form><p id="message"></p><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('password').value;if(p!==document.getElementById('confirm').value){document.getElementById('message').textContent='رمزها یکسان نیستند';return;}const b=e.target.querySelector('button');b.disabled=true;try{const r=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:{{ token|tojson }},password:p})});const d=await r.json();document.getElementById('message').textContent=d.success?'رمز تغییر کرد. اکنون وارد شوید.':d.error||'خطا';if(d.success)e.target.remove();}catch(e){document.getElementById('message').textContent='خطای ارتباط';}finally{b.disabled=false;}};</script>{% else %}<p>لینک نامعتبر یا منقضی شده است.</p><a href="/forgot-password">درخواست لینک جدید</a>{% endif %}<p><a href="/login">ورود</a></p></main></html>
