<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <script src="/static/main.js?v=2"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>پروفایل — خیام</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/fonts.css?v=1">
  <link rel="stylesheet" href="/static/style.css?v=3">
  <style>
  body {
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .nav-links { display: flex; gap: 6px; }

  .nav-btn {
    padding: 5px 12px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-family: 'Vazirmatn', sans-serif;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
  }
  .nav-btn:hover { background: var(--surface2); color: var(--text); }
  .nav-btn.danger:hover { border-color: var(--red); color: var(--red-lt); }

  /* ── PAGE ── */
  .page {
    position: relative;
    z-index: 1;
    max-width: 700px;
    margin: 0 auto;
    padding: 40px 20px 100px;
  }

  /* ── USER CARD ── */
  .user-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 32px;
    animation: fadeUp 0.4s ease both;
  }

  .user-avatar {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: rgba(216,178,90,0.15);
    border: 2px solid var(--gold-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700;
    color: var(--gold);
    flex-shrink: 0;
  }

  .user-info { flex: 1; }
  .user-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .user-detail { font-size: 13px; color: var(--text-dim); line-height: 1.8; }

  .user-badge {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 99px;
    background: rgba(216,178,90,0.15);
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    font-weight: 500;
    white-space: nowrap;
  }

  /* ── SECTION TITLE ── */
  .section-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  /* ── CONVERSATION LIST ── */
  .conv-list { display: flex; flex-direction: column; gap: 8px; }

  .conv-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
    animation: fadeUp 0.3s ease both;
  }
  .conv-card:hover { border-color: var(--gold-dim); background: var(--surface2); }

  .conv-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }

  .conv-body { flex: 1; min-width: 0; }

  .conv-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }

  .conv-date { font-size: 12px; color: var(--text-dim); }

  .conv-del {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .conv-del:hover { background: var(--red); color: var(--red-lt); border-color: var(--red); }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.8;
  }
  .empty-state a { color: var(--gold); text-decoration: none; }

  .loading {
    text-align: center;
    padding: 32px;
    color: var(--text-dim);
    font-size: 14px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    header { padding: 0 14px; }
    .page { padding: 24px 14px 100px; }
    .user-card { padding: 20px 16px; gap: 14px; }
    .user-name { font-size: 17px; }
    .user-avatar { width: 48px; height: 48px; font-size: 20px; }
  }
    .plans-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:26px; }
    .plan-row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; flex-wrap:wrap; }
    .plan-row:last-of-type { border-bottom:none; }
    .plan-row .pl-name { font-weight:700; }
    .plan-row .pl-exp { font-size:12px; color:var(--text-dim); }
    .plan-row .pl-exp.soon { color:#e0a050; }
    .usage-line { font-size:12px; color:var(--text-dim); margin-top:6px; }
    .usage-track { height:5px; background:var(--surface2); border-radius:3px; overflow:hidden; margin-top:4px; }
    .usage-fill { height:100%; background:var(--gold); border-radius:3px; }
    .plans-actions { margin-top:12px; font-size:13px; }
    .plans-actions a { color:var(--gold); text-decoration:none; }
</style>
</head>
<body>
  <header>
    <a href="/" class="logo">
      <svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="9" y="9" width="22" height="22" rx="1.500"/><rect x="9" y="9" width="22" height="22" rx="1.500" transform="rotate(45 20 20)"/><circle cx="20" cy="20" r="4.400"/></g></svg>
      <span class="logo-text">خیام</span>
    </a>
    <div class="nav-links">
      <a href="/chat" class="nav-btn">چت جدید</a>
      <a href="/tutor"   class="nav-btn active">بیاموز</a>
  <a href="/pricing" class="nav-btn">قیمت‌ها</a>
      <a href="/logout" class="nav-btn danger">خروج</a>
    </div>
  </header>

  <div class="page">

    <!-- user info -->
    <div class="user-card" id="user-card">
      <div class="user-avatar" id="user-avatar">؟</div>
      <div class="user-info">
        <div class="user-name" id="user-name">در حال بارگذاری...</div>
        <div class="user-detail" id="user-detail"></div>
      </div>
      <span class="user-badge" id="user-badge">رایگان</span>
    </div>

    <!-- plans -->
    <div class="section-title">پلان‌های من</div>
    <div class="plans-card" id="plans-card"><div class="loading">در حال بارگذاری...</div></div>

    <!-- conversations -->
    <div class="section-title">گفتگوهای ذخیره شده</div>
    <div class="conv-list" id="conv-list">
      <div class="loading">در حال بارگذاری...</div>
    </div>

  </div>
<!-- BOTTOM NAV — mobile only -->
<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a href="/" class="bottom-tab">
      <span class="tab-icon"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7v8.500a.5.5 0 0 1-.5.500H15v-5.500H9V20H4.500a.5.5 0 0 1-.5-.5V11Z"/></g></svg></span>
      <span class="tab-label">خانه</span>
    </a>
    <a href="/chat" class="bottom-tab">
      <span class="tab-icon"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-11.600 7.100L4 20l1-4.200A8 8 0 1 1 20 12Z"/></g></svg></span>
      <span class="tab-label">چت</span>
    </a>
    <a href="/tutor" class="bottom-tab">
      <span class="tab-icon"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m2.500 9 9.500-4.500L21.500 9 12 13.500 2.500 9Z"/><path d="M6.500 11.200v4.300c0 1.200 2.500 2.600 5.500 2.600s5.500-1.400 5.500-2.600v-4.300"/></g></svg></span>
      <span class="tab-label">بیاموز</span>
    </a>
    <a href="/profile" class="bottom-tab">
      <span class="tab-icon"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.500" r="3.600"/><path d="M4.500 20c.9-3.600 3.900-5.500 7.500-5.500s6.600 1.900 7.500 5.500"/></g></svg></span>
      <span class="tab-label">پروفایل</span>
    </a>
  </div>
</nav>
  <script>
    async function checkAdminLink() {
    const res  = await fetch('/api/me');
    const data = await res.json();
    if (data.is_admin) {
      const links = document.querySelector('.nav-links');
      const adminLink = document.createElement('a');
      adminLink.href      = '/admin';
      adminLink.className = 'nav-btn';
      adminLink.textContent = 'ادمین';
      adminLink.style.borderColor = 'var(--gold-dim)';
      adminLink.style.color = 'var(--gold)';
      links.prepend(adminLink);
    }
  }
  checkAdminLink();
   function formatDate(iso) {
  // server sends UTC time without timezone info — add Z to tell
  // JavaScript it is UTC so it converts to local time correctly
  const utcString = iso.endsWith('Z') ? iso : iso + 'Z';
  const d    = new Date(utcString);
  const now  = new Date();
  const diff = now - d;
  if (diff < 60000)    return 'همین الان';
  if (diff < 3600000)  return Math.floor(diff / 60000) + ' دقیقه پیش';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' ساعت پیش';
  return d.toLocaleDateString('fa-AF');
}

    async function loadUser() {
      const res  = await fetch('/api/me');
      const data = await res.json();
      if (!data.logged_in) {
        window.location.href = '/login';
        return;
      }
      const initial = data.username.charAt(0).toUpperCase();
      document.getElementById('user-avatar').textContent = initial;
      document.getElementById('user-name').textContent   = data.username;
      const detail = [];
      if (data.email) detail.push('' + data.email);
      if (data.phone) detail.push('' + data.phone);
      document.getElementById('user-detail').textContent = detail.join(' · ');
      renderPlans(data);
    }

    const PLAN_LABELS = { free: 'رایگان', basic: 'پایه', pro: 'حرفه‌ای', premium: 'پریمیوم', tutor_pro: 'استاد حرفه‌ای' };

    function expiryHtml(iso) {
      if (!iso) return '';
      const d    = new Date(iso.endsWith('Z') ? iso : iso + 'Z');
      const days = Math.ceil((d - new Date()) / 86400000);
      const date = d.toLocaleDateString('fa-AF');
      if (days <= 0) return '<span class="pl-exp soon">امروز تمام می‌شود</span>';
      return `<span class="pl-exp${days <= 3 ? ' soon' : ''}">تا ${escapeHtml(date)} · ${days} روز مانده</span>`;
    }

    function usageHtml(summary) {
      // first tier = best model; show the window that actually limits the user
      if (!summary || !summary.length) return '';
      return summary.map(t => {
        const pct  = t.limit ? Math.min(100, Math.round((t.used / t.limit) * 100)) : 0;
        const per  = t.period === 'daily' ? 'امروز' : 'این ماه';
        return `<div class="usage-line">${per}: ${t.used.toLocaleString('fa-AF')} از ${t.limit.toLocaleString('fa-AF')}
          <div class="usage-track"><div class="usage-fill" style="width:${pct}%"></div></div></div>`;
      }).join('');
    }

    async function renderPlans(me) {
      const card = document.getElementById('plans-card');
      document.getElementById('user-badge').textContent = PLAN_LABELS[me.chat_plan] || me.chat_plan;
      let usage = null;
      try { usage = await (await fetch('/api/usage')).json(); } catch (e) {}
      card.innerHTML = `
        <div class="plan-row"><div><span class="pl-name">گفتگو: ${escapeHtml(PLAN_LABELS[me.chat_plan] || me.chat_plan)}</span>
          ${me.chat_plan !== 'free' ? '<br>' + expiryHtml(me.chat_plan_expires_at) : ''}</div></div>
        ${usage ? usageHtml(usage.summary.slice(0, 2)) : ''}
        <div class="plan-row"><div><span class="pl-name">استاد: ${escapeHtml(PLAN_LABELS[me.tutor_plan] || me.tutor_plan)}</span>
          ${me.tutor_plan !== 'free' ? '<br>' + expiryHtml(me.tutor_plan_expires_at) : ''}</div></div>
        ${usage ? usageHtml(usage.tutor_summary.slice(0, 1)) : ''}
        <div class="plans-actions"><a href="/pricing#contact">تمدید یا ارتقای پلان ←</a></div>`;
    }

    async function loadConversations() {
      const list = document.getElementById('conv-list');
      try {
        const res   = await fetch('/api/conversations');
        const convs = await res.json();

        if (convs.length === 0) {
          list.innerHTML = `
            <div class="empty-state">
              هنوز گفتگویی ندارید.<br/>
              <a href="/chat">اولین چت خود را شروع کنید ←</a>
            </div>`;
          return;
        }

        list.innerHTML = '';
        convs.forEach((conv, i) => {
          const div = document.createElement('a');
          div.className = 'conv-card';
          div.href      = `/chat?conv=${conv.id}`;
          div.style.animationDelay = (i * 0.05) + 's';
          div.innerHTML = `
            <div class="conv-icon"></div>
            <div class="conv-body">
              <div class="conv-title">${escapeHtml(conv.title)}</div>
              <div class="conv-date">${formatDate(conv.updated_at)}</div>
            </div>
            <button class="conv-del" onclick="deleteConv(event, ${conv.id})">✕</button>`;
          list.appendChild(div);
        });
      } catch (err) {
        list.innerHTML = '<div class="empty-state">خطا در بارگذاری گفتگوها</div>';
      }
    }

    async function deleteConv(e, id) {
      e.preventDefault();
      e.stopPropagation();
      await fetch(`/api/conversations/${id}`, { method: 'DELETE' });
      loadConversations();
    }
    

   
    loadUser();
    loadConversations();
  </script>
</body>
</html>
