<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>استاد خیام — کلاس درس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    body { height:100vh; display:flex; flex-direction:column; overflow:hidden; }

    header {
      z-index:20; display:flex; align-items:center; justify-content:space-between;
      padding:0 20px; height:56px;
      background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0;
    }
    .nav-btn {
      padding:5px 12px; border-radius:7px; border:1px solid var(--border);
      background:transparent; color:var(--text-dim);
      font-family:'Vazirmatn',sans-serif; font-size:13px;
      cursor:pointer; text-decoration:none; transition:all 0.2s;
    }
    .nav-btn:hover { background:var(--surface2); color:var(--text); }

    /* XP BAR */
    .xp-bar-wrap {
      display:flex; align-items:center; gap:10px; padding:0 8px;
    }
    .xp-label { font-size:12px; color:var(--gold); font-weight:700; white-space:nowrap; }
    .xp-track {
      width:120px; height:8px; background:var(--surface2);
      border-radius:4px; overflow:hidden; border:1px solid var(--border);
    }
    .xp-fill {
      height:100%; background:linear-gradient(90deg, var(--gold-dim), var(--gold));
      border-radius:4px; transition:width 0.8s cubic-bezier(0.34,1.56,0.64,1);
    }

    .main { flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative; z-index:1; }

    /* ══ SCREEN 1: SUBJECT SELECT ══ */
    .screen { flex:1; overflow-y:auto; display:none; }
    .screen.active { display:flex; }

    .subject-screen {
      flex-direction:column; align-items:center;
      justify-content:center; padding:32px 16px;
    }

    .screen-top { text-align:center; margin-bottom:40px; }
    .screen-top h1 { font-size:28px; font-weight:900; color:var(--gold); margin-bottom:8px; }
    .screen-top p { font-size:14px; color:var(--text-dim); line-height:1.8; }

    .subject-grid {
      display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
      gap:14px; max-width:700px; width:100%;
    }

    .subject-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:16px; padding:24px 16px; text-align:center;
      cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden;
    }
    .subject-card:hover { border-color:var(--gold-dim); transform:translateY(-3px); }
    .subject-card.has-progress { border-color:var(--gold-dim); }
    .subject-emoji { font-size:36px; margin-bottom:12px; display:block; }
    .subject-name { font-size:16px; font-weight:700; color:var(--text); margin-bottom:4px; }
    .subject-progress-bar {
      height:4px; background:var(--surface2); border-radius:2px;
      margin-top:10px; overflow:hidden;
    }
    .subject-progress-fill {
      height:100%; background:var(--gold); border-radius:2px; transition:width 0.5s;
    }
    .subject-xp { font-size:11px; color:var(--text-dim); margin-top:6px; }

    /* ══ SCREEN 2: TOPIC SELECT ══ */
    .topic-screen { flex-direction:column; padding:0; }

    .topic-header {
      padding:16px 20px; background:var(--surface);
      border-bottom:1px solid var(--border); flex-shrink:0;
      display:flex; align-items:center; gap:12px;
    }
    .back-btn {
      width:32px; height:32px; border-radius:8px;
      border:1px solid var(--border); background:transparent;
      color:var(--text-dim); cursor:pointer; display:flex;
      align-items:center; justify-content:center; font-size:16px;
      transition:all 0.2s;
    }
    .back-btn:hover { background:var(--surface2); color:var(--text); }

    .topic-subject-name { font-size:16px; font-weight:700; color:var(--gold); }

    .start-options {
      display:flex; gap:10px; padding:16px 20px;
      border-bottom:1px solid var(--border); flex-shrink:0;
    }
    .option-btn {
      flex:1; padding:10px; border-radius:10px;
      border:1px solid var(--border); background:var(--surface);
      color:var(--text-dim); font-family:'Vazirmatn',sans-serif;
      font-size:13px; cursor:pointer; transition:all 0.2s; text-align:center;
    }
    .option-btn:hover { border-color:var(--gold-dim); color:var(--gold); }
    .option-btn.active { border-color:var(--gold); background:rgba(201,168,76,0.1); color:var(--gold); }

    .levels-container { flex:1; overflow-y:auto; padding:20px; }

    .level-section { margin-bottom:28px; }
    .level-title {
      font-size:13px; font-weight:700; color:var(--text-dim);
      letter-spacing:0.08em; text-transform:uppercase;
      margin-bottom:12px; display:flex; align-items:center; gap:8px;
    }
    .level-badge {
      padding:2px 8px; border-radius:99px; font-size:10px;
      background:rgba(201,168,76,0.1); color:var(--gold);
      border:1px solid var(--gold-dim);
    }

    .topics-list { display:flex; flex-direction:column; gap:8px; }

    .topic-item {
      display:flex; align-items:center; gap:12px;
      padding:12px 16px; border-radius:12px;
      border:1px solid var(--border); background:var(--surface);
      cursor:pointer; transition:all 0.2s;
    }
    .topic-item:hover { border-color:var(--gold-dim); background:var(--surface2); }
    .topic-item.completed { border-color:rgba(122,191,106,0.4); }
    .topic-item.current { border-color:var(--gold); background:rgba(201,168,76,0.08); }

    .topic-status {
      width:28px; height:28px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; font-size:13px;
      background:var(--surface2); border:1px solid var(--border);
    }
    .topic-status.done { background:rgba(122,191,106,0.15); border-color:#3a5c2e; color:#7abf6a; }
    .topic-status.active { background:rgba(201,168,76,0.15); border-color:var(--gold-dim); color:var(--gold); }

    .topic-info { flex:1; }
    .topic-item-title { font-size:14px; font-weight:500; color:var(--text); margin-bottom:2px; }
    .topic-item-desc { font-size:12px; color:var(--text-dim); }

    .quiz-item {
      display:flex; align-items:center; gap:12px;
      padding:12px 16px; border-radius:12px;
      border:1px solid var(--gold-dim); background:rgba(201,168,76,0.06);
      cursor:pointer; transition:all 0.2s; margin-top:8px;
    }
    .quiz-item:hover { background:rgba(201,168,76,0.12); }
    .quiz-item.locked { opacity:0.4; cursor:not-allowed; }

    /* ══ SCREEN 3: CHAT ══ */
    .chat-screen { flex-direction:column; }

    .chat-topic-bar {
      padding:10px 20px; background:var(--surface2);
      border-bottom:1px solid var(--border);
      display:flex; align-items:center; gap:10px; flex-shrink:0;
    }
    .topic-tag {
      padding:3px 12px; border-radius:99px; font-size:12px; font-weight:500;
      background:rgba(201,168,76,0.15); color:var(--gold);
      border:1px solid var(--gold-dim);
    }
    .complete-topic-btn {
      margin-right:auto; padding:4px 14px; border-radius:99px;
      border:1px solid #3a5c2e; background:rgba(58,92,46,0.2);
      color:#7abf6a; font-family:'Vazirmatn',sans-serif;
      font-size:12px; cursor:pointer; transition:all 0.2s;
    }
    .complete-topic-btn:hover { background:rgba(58,92,46,0.4); }

    .chat-wrapper { flex:1; overflow-y:auto; padding:24px 16px; }
    .messages { max-width:700px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }

    .message { display:flex; gap:10px; animation:fadeUp 0.3s ease both; }
    .message.user { flex-direction:row-reverse; }

    .avatar {
      width:34px; height:34px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:11px; font-weight:700; margin-top:2px;
    }
    .avatar.ai { background:var(--surface2); border:1px solid var(--gold-dim); color:var(--gold); }
    .avatar.user { background:var(--user-bg); border:1px solid var(--user-border); font-size:15px; }

    .bubble {
      max-width:78%; padding:12px 16px; border-radius:14px;
      font-size:15px; line-height:1.85;
    }
    .message.ai .bubble { background:var(--surface); border:1px solid var(--border); border-top-right-radius:4px; }
    .message.user .bubble { background:var(--user-bg); border:1px solid var(--user-border); border-top-left-radius:4px; }

    .bubble p { margin-bottom:10px; }
    .bubble p:last-child { margin-bottom:0; }
    .bubble ul, .bubble ol { padding-right:20px; margin-bottom:10px; }
    .bubble li { margin-bottom:6px; line-height:1.7; }
    .bubble h1,.bubble h2,.bubble h3 { font-size:15px; font-weight:700; color:var(--gold); margin:14px 0 6px; }
    .bubble h1:first-child,.bubble h2:first-child,.bubble h3:first-child { margin-top:0; }
    .bubble strong { color:var(--text); font-weight:700; }
    .bubble code {
      background:var(--surface2); border:1px solid var(--border);
      border-radius:4px; padding:1px 6px; font-size:13px;
      direction:ltr; display:inline-block;
    }
    .bubble pre {
      background:#0d1117; border:1px solid var(--border);
      border-radius:8px; padding:12px; overflow-x:auto;
      margin:10px 0; direction:ltr; text-align:left;
    }
    .bubble pre code { background:none; border:none; padding:0; color:#e6edf3; display:block; }

    .typing-dots { display:flex; gap:5px; align-items:center; padding:4px 0; }
    .typing-dots span {
      width:7px; height:7px; background:var(--gold-dim);
      border-radius:50%; animation:bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay:0.2s; }
    .typing-dots span:nth-child(3) { animation-delay:0.4s; }

    .input-area {
      padding:12px 20px 16px;
      background:var(--surface); border-top:1px solid var(--border); flex-shrink:0;
    }
    .input-box {
      max-width:700px; margin:0 auto; display:flex; align-items:flex-end; gap:10px;
      background:var(--surface2); border:1px solid var(--border);
      border-radius:14px; padding:10px 12px; transition:border-color 0.2s;
    }
    .input-box:focus-within { border-color:var(--gold-dim); }
    #user-input {
      flex:1; background:transparent; border:none; outline:none;
      color:var(--text); font-family:'Vazirmatn',sans-serif;
      font-size:15px; resize:none; max-height:140px; line-height:1.6; direction:rtl;
    }
    #user-input::placeholder { color:var(--text-dim); }
    #send-btn {
      width:34px; height:34px; border-radius:8px; border:none;
      background:var(--gold); color:#0f0e0c; font-size:16px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      flex-shrink:0; transition:all 0.2s;
    }
    #send-btn:hover { background:#e0bb60; transform:scale(1.05); }
    #send-btn:disabled { background:var(--border); color:var(--text-dim); cursor:not-allowed; transform:none; }
    .input-hint { text-align:center; font-size:11px; color:var(--text-dim); margin-top:7px; }

    /* ══ QUIZ SCREEN ══ */
    .quiz-screen { flex-direction:column; align-items:center; justify-content:center; padding:32px 16px; }

    .quiz-card {
      width:100%; max-width:600px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:18px; padding:32px; animation:fadeUp 0.4s ease both;
    }

    .quiz-progress { margin-bottom:24px; }
    .quiz-progress-text {
      display:flex; justify-content:space-between;
      font-size:12px; color:var(--text-dim); margin-bottom:8px;
    }
    .quiz-progress-track {
      height:6px; background:var(--surface2); border-radius:3px; overflow:hidden;
    }
    .quiz-progress-fill {
      height:100%; background:var(--gold); border-radius:3px; transition:width 0.4s;
    }

    .quiz-question { font-size:18px; font-weight:700; color:var(--text); margin-bottom:24px; line-height:1.6; }

    .quiz-options { display:flex; flex-direction:column; gap:10px; }
    .quiz-option {
      padding:14px 18px; border-radius:12px;
      border:1px solid var(--border); background:var(--surface2);
      cursor:pointer; transition:all 0.2s;
      font-family:'Vazirmatn',sans-serif; font-size:15px;
      color:var(--text); text-align:right;
    }
    .quiz-option:hover:not(.answered) { border-color:var(--gold-dim); color:var(--gold); }
    .quiz-option.correct { border-color:#3a5c2e; background:rgba(58,92,46,0.2); color:#7abf6a; }
    .quiz-option.wrong { border-color:#5c2e2e; background:rgba(92,46,46,0.2); color:#e06060; }
    .quiz-option.answered { cursor:not-allowed; }

    .quiz-explanation {
      margin-top:16px; padding:14px; border-radius:10px;
      background:rgba(201,168,76,0.08); border:1px solid var(--gold-dim);
      font-size:13px; color:var(--text-dim); line-height:1.7; display:none;
    }
    .quiz-explanation.visible { display:block; }

    .quiz-next-btn {
      margin-top:20px; width:100%; padding:13px;
      border-radius:10px; border:none; background:var(--gold);
      color:#0f0e0c; font-family:'Vazirmatn',sans-serif;
      font-size:15px; font-weight:700; cursor:pointer;
      transition:all 0.2s; display:none;
    }
    .quiz-next-btn.visible { display:block; }
    .quiz-next-btn:hover { background:#e0bb60; }

    /* quiz result */
    .quiz-result {
      text-align:center; padding:40px 20px;
    }
    .quiz-score-big {
      font-size:72px; font-weight:900; color:var(--gold);
      line-height:1; margin-bottom:8px;
    }
    .quiz-score-label { font-size:16px; color:var(--text-dim); margin-bottom:24px; }
    .quiz-xp-earned {
      font-size:14px; color:#7abf6a;
      background:rgba(58,92,46,0.2); border:1px solid #3a5c2e;
      border-radius:99px; padding:6px 18px; display:inline-block; margin-bottom:24px;
    }
    .quiz-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    .quiz-action-btn {
      padding:10px 24px; border-radius:10px;
      font-family:'Vazirmatn',sans-serif; font-size:14px; font-weight:700;
      cursor:pointer; transition:all 0.2s;
    }
    .btn-primary { background:var(--gold); color:#0f0e0c; border:none; }
    .btn-primary:hover { background:#e0bb60; }
    .btn-secondary { background:transparent; color:var(--text-dim); border:1px solid var(--border); }
    .btn-secondary:hover { border-color:var(--gold-dim); color:var(--gold); }

    /* XP POPUP */
    .xp-popup {
      position:fixed; top:70px; left:50%; transform:translateX(-50%) translateY(-20px);
      background:var(--surface); border:1px solid var(--gold);
      border-radius:99px; padding:8px 20px;
      font-size:14px; font-weight:700; color:var(--gold);
      opacity:0; transition:all 0.5s; z-index:100; pointer-events:none;
    }
    .xp-popup.show {
      opacity:1; transform:translateX(-50%) translateY(0);
    }

    .limit-notice {
      text-align:center; font-size:12px; color:var(--gold);
      background:rgba(201,168,76,0.08); border:1px solid var(--gold-dim);
      border-radius:8px; padding:8px 14px; margin:0 auto; max-width:500px;
    }

    @keyframes bounce {
      0%,60%,100% { transform:translateY(0); opacity:0.4; }
      30% { transform:translateY(-6px); opacity:1; }
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(14px); }
      to { opacity:1; transform:translateY(0); }
    }

    @media (max-width:600px) {
      .subject-grid { grid-template-columns:1fr 1fr; }
      .bubble { max-width:88%; font-size:14px; }
      .xp-track { width:80px; }
      .input-area { padding:10px 12px 14px; }
    }
  </style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <a href="/" class="logo">
      <div class="logo-mark">خ</div>
      <span class="logo-text">خیام</span>
    </a>
  </div>
  <div class="xp-bar-wrap" id="xp-bar-wrap" style="display:none">
    <span class="xp-label" id="xp-label">⚡ 0 XP</span>
    <div class="xp-track">
      <div class="xp-fill" id="xp-fill" style="width:0%"></div>
    </div>
  </div>
  <div style="display:flex;gap:6px;">
    <a href="/chat" class="nav-btn">چت</a>
    <div id="auth-nav">
      <a href="/login" class="nav-btn">ورود</a>
    </div>
  </div>
</header>

<div class="xp-popup" id="xp-popup"></div>

<div class="main">

  <!-- SCREEN 1: SUBJECT SELECT -->
  <div class="screen subject-screen active" id="screen-subject">
    <div class="screen-top">
      <div style="font-size:48px;margin-bottom:16px;">📚</div>
      <h1>استاد خیام</h1>
      <p>مضمون خود را انتخاب کنید و شروع به یادگیری کنید</p>
    </div>
    <div class="subject-grid" id="subject-grid"></div>
  </div>

  <!-- SCREEN 2: TOPIC SELECT -->
  <div class="screen topic-screen" id="screen-topic">
    <div class="topic-header">
      <button class="back-btn" onclick="showScreen('subject')">←</button>
      <span class="topic-subject-name" id="topic-subject-name"></span>
    </div>
    <div class="start-options">
      <button class="option-btn active" id="btn-browse" onclick="setBrowseMode('browse')">
        📋 انتخاب موضوع
      </button>
      <button class="option-btn" id="btn-placement" onclick="startPlacementTest()">
        🎯 تست سطح‌بندی
      </button>
    </div>
    <div class="levels-container" id="levels-container"></div>
  </div>

  <!-- SCREEN 3: CHAT -->
  <div class="screen chat-screen" id="screen-chat">
    <div class="chat-topic-bar">
      <button class="back-btn" onclick="showScreen('topic')">←</button>
      <span class="topic-tag" id="chat-topic-tag"></span>
      <button class="complete-topic-btn" onclick="completeTopic()">✓ موضوع را کامل کردم</button>
    </div>
    <div class="chat-wrapper" id="chat-wrapper">
      <div class="messages" id="messages"></div>
    </div>
    <div class="input-area">
      <div class="input-box">
        <textarea id="user-input" rows="1" placeholder="سوال خود را بنویسید..."></textarea>
        <button id="send-btn" onclick="sendMessage()">↑</button>
      </div>
      <p class="input-hint">Enter برای ارسال · Shift+Enter برای سطر جدید</p>
    </div>
  </div>

  <!-- SCREEN 4: QUIZ -->
  <div class="screen quiz-screen" id="screen-quiz">
    <div class="quiz-card" id="quiz-card">
      <!-- filled by JS -->
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a href="/" class="bottom-tab"><span class="tab-icon">🏠</span><span class="tab-label">خانه</span></a>
    <a href="/chat" class="bottom-tab"><span class="tab-icon">💬</span><span class="tab-label">چت</span></a>
    <a href="/tutor" class="bottom-tab active"><span class="tab-icon">📚</span><span class="tab-label">بیاموز</span></a>
    <a href="/profile" class="bottom-tab"><span class="tab-icon">👤</span><span class="tab-label">پروفایل</span></a>
  </div>
</nav>

<script>
  marked.setOptions({ breaks:true, gfm:true });

  // ── STATE ──
  let curriculum        = {};
  let userProgress      = {};
  let currentUser       = null;
  let currentSubject    = null;
  let currentTopic      = null;
  let currentLevel      = 1;
  let chatHistory       = [];
  let isLoading         = false;
  let switchNoticeShown = false;
  let totalXP           = 0;

  // quiz state
  let quizQuestions  = [];
  let quizCurrent    = 0;
  let quizScore      = 0;
  let quizAnswered   = false;

  // ── INIT ──
  async function init() {
    const [meRes, currRes] = await Promise.all([
      fetch('/api/me'),
      fetch('/api/tutor/curriculum')
    ]);
    const meData   = await meRes.json();
    const currData = await currRes.json();
    curriculum = currData;

    if (meData.logged_in) {
      currentUser = meData;
      document.getElementById('auth-nav').innerHTML =
        `<a href="/profile" class="nav-btn">${meData.username}</a>`;
      document.getElementById('xp-bar-wrap').style.display = 'flex';
      await loadAllProgress();
    }

    renderSubjects();
  }

  async function loadAllProgress() {
    if (!currentUser) return;
    for (const subj of Object.keys(curriculum)) {
      try {
        const res  = await fetch(`/api/tutor/progress/${subj}`);
        const data = await res.json();
        userProgress[subj] = data;
        if (data.total_xp !== undefined) {
          totalXP = data.total_xp;
        }
      } catch(e) {}
    }
    updateXPBar(totalXP, false);
  }

  // ── XP BAR ──
  function updateXPBar(xp, animate=true) {
    totalXP = xp;
    document.getElementById('xp-label').textContent = `⚡ ${xp} XP`;
    // XP bar fills per 1000 XP
    const pct = Math.min(100, (xp % 1000) / 10);
    document.getElementById('xp-fill').style.width = pct + '%';
  }

  function showXPPopup(amount) {
    const popup = document.getElementById('xp-popup');
    popup.textContent = `+${amount} XP ⚡`;
    popup.classList.add('show');
    setTimeout(() => popup.classList.remove('show'), 2000);
  }

  // ── SCREENS ──
  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(`screen-${name}`).classList.add('active');
  }

  // ── RENDER SUBJECTS ──
  function renderSubjects() {
    const grid = document.getElementById('subject-grid');
    grid.innerHTML = '';

    for (const [key, subj] of Object.entries(curriculum)) {
      const prog     = userProgress[key];
      const subjXP   = prog?.progress?.subject_xp || 0;
      const lastTopic = prog?.progress?.last_topic_title || '';
      const completed = prog?.progress?.completed_topics?.length || 0;
      const total     = Object.values(subj.levels).reduce((a,l) => a + l.topics.length, 0);
      const pct       = total > 0 ? Math.round((completed / total) * 100) : 0;

      const card = document.createElement('div');
      card.className = `subject-card ${pct > 0 ? 'has-progress' : ''}`;
      card.innerHTML = `
        <span class="subject-emoji">${subj.emoji}</span>
        <div class="subject-name">${subj.name}</div>
        ${lastTopic ? `<div class="subject-xp" style="color:var(--text-dim);font-size:11px;margin-top:4px;">ادامه: ${lastTopic}</div>` : ''}
        <div class="subject-progress-bar">
          <div class="subject-progress-fill" style="width:${pct}%"></div>
        </div>
        <div class="subject-xp">${subjXP} XP · ${pct}% کامل</div>
      `;
      card.onclick = () => selectSubject(key);
      grid.appendChild(card);
    }
  }

  // ── SELECT SUBJECT ──
  async function selectSubject(subjectKey) {
    currentSubject = subjectKey;
    const subj = curriculum[subjectKey];
    document.getElementById('topic-subject-name').textContent = subj.emoji + ' ' + subj.name;

    renderTopics();
    showScreen('topic');
  }

  function renderTopics() {
    const container  = document.getElementById('levels-container');
    const subj       = curriculum[currentSubject];
    const prog       = userProgress[currentSubject];
    const completed  = prog?.progress?.completed_topics || [];
    const compQuizzes = prog?.progress?.completed_quizzes || [];
    const lastTopic  = prog?.progress?.last_topic_title || '';
    container.innerHTML = '';

    for (const [levelNum, levelData] of Object.entries(subj.levels)) {
      const lvl = parseInt(levelNum);

      const section = document.createElement('div');
      section.className = 'level-section';

      const levelTopics = levelData.topics;
      const levelDone   = levelTopics.every(t => completed.includes(t.key));
      const quizKey     = `${currentSubject}_level${lvl}`;
      const quizDone    = compQuizzes.includes(quizKey);

      section.innerHTML = `
        <div class="level-title">
          سطح ${lvl} — ${levelData.title}
          ${levelDone ? '<span class="level-badge">✓ کامل</span>' : ''}
        </div>
      `;

      const list = document.createElement('div');
      list.className = 'topics-list';

      levelTopics.forEach(topic => {
        const isDone    = completed.includes(topic.key);
        const isCurrent = topic.title === lastTopic;
        const item      = document.createElement('div');
        item.className  = `topic-item ${isDone ? 'completed' : ''} ${isCurrent ? 'current' : ''}`;
        item.innerHTML  = `
          <div class="topic-status ${isDone ? 'done' : isCurrent ? 'active' : ''}">
            ${isDone ? '✓' : isCurrent ? '▶' : '○'}
          </div>
          <div class="topic-info">
            <div class="topic-item-title">${topic.title}</div>
            <div class="topic-item-desc">${topic.desc}</div>
          </div>
          ${isDone ? '<span style="font-size:11px;color:#7abf6a;">+15 XP</span>' : ''}
        `;
        item.onclick = () => startTopic(topic, lvl);
        list.appendChild(item);
      });

      section.appendChild(list);

      // quiz button after each level
      const allTopicsDone = levelTopics.every(t => completed.includes(t.key));
      const quizDiv = document.createElement('div');
      quizDiv.className = `quiz-item ${!allTopicsDone ? 'locked' : ''} ${quizDone ? 'completed' : ''}`;
      quizDiv.innerHTML = `
        <div class="topic-status ${quizDone ? 'done' : ''}">
          ${quizDone ? '⭐' : '📝'}
        </div>
        <div class="topic-info">
          <div class="topic-item-title">کوییز سطح ${lvl}</div>
          <div class="topic-item-desc">${allTopicsDone ? 'آماده — امتحان بده!' : 'اول همه موضوعات را کامل کن'}</div>
        </div>
        ${quizDone ? '<span style="font-size:11px;color:var(--gold);">+50 XP</span>' : ''}
      `;
      if (allTopicsDone) {
        quizDiv.onclick = () => startQuiz(lvl);
      }
      section.appendChild(quizDiv);

      container.appendChild(section);
    }
  }

  // ── START TOPIC ──
  async function startTopic(topic, level) {
    currentTopic = topic;
    currentLevel = level;
    switchNoticeShown = false;

    document.getElementById('chat-topic-tag').textContent = topic.title;
    document.getElementById('messages').innerHTML = '';
    showScreen('chat');

    // load saved history
    if (currentUser) {
      try {
        const res  = await fetch(`/api/tutor/progress/${currentSubject}`);
        const data = await res.json();
        chatHistory = data.chat_history || [];

        // render existing messages
        if (chatHistory.length > 0) {
          chatHistory.forEach(m => appendBubble(m.role === 'user' ? 'user' : 'ai', m.content));
          appendSystemNote('به درس ادامه می‌دهیم...');
        } else {
          // fresh start — send opening message
          await sendOpeningMessage();
        }
      } catch(e) {
        await sendOpeningMessage();
      }
    } else {
      await sendOpeningMessage();
    }

    await notifyStartTopic();
  }

  async function notifyStartTopic() {
    if (!currentUser) return;
    try {
      await fetch('/api/tutor/start-topic', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          subject:   currentSubject,
          topic_key: currentTopic.key,
          level:     currentLevel
        })
      });
    } catch(e) {}
  }

  async function sendOpeningMessage() {
    const opener = `درس "${currentTopic.title}" را شروع کن. با یک معرفی جذاب و سوال برای سنجش دانش من شروع کن.`;
    await sendToAPI(opener, true);
  }

  function appendSystemNote(text) {
    const note = document.createElement('div');
    note.style.cssText = `text-align:center;font-size:12px;color:var(--text-dim);
      padding:6px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);
      margin:8px 0;`;
    note.textContent = text;
    document.getElementById('messages').appendChild(note);
    scrollToBottom();
  }

  // ── SEND MESSAGE ──
  async function sendMessage() {
    const input = document.getElementById('user-input');
    const text  = input.value.trim();
    if (!text || isLoading) return;

    isLoading = true;
    document.getElementById('send-btn').disabled = true;
    input.value = '';
    input.style.height = 'auto';

    appendBubble('user', text);
    chatHistory.push({role:'user', content:text});
    showTyping();

    await sendToAPI(text, false);

    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }

  async function sendToAPI(message, isSystem) {
    if (!isSystem) showTyping();

    try {
      const res = await fetch('/api/tutor/chat', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          subject:   currentSubject,
          topic_key: currentTopic?.key,
          level:     currentLevel,
          message:   message
        })
      });

      const data = await res.json();
      removeTyping();

      if (!data.reply) {
        appendBubble('ai', 'متأسفم، مشکلی پیش آمد. دوباره امتحان کنید.');
        return;
      }

      if (data.switch_notice && !switchNoticeShown) {
        switchNoticeShown = true;
        const notice = document.createElement('div');
        notice.className = 'limit-notice';
        if (data.reset_ts) {
          const resetDate  = new Date(data.reset_ts * 1000);
          const timeStr    = resetDate.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
          const tomorrow   = new Date();
          tomorrow.setDate(tomorrow.getDate() + 1);
          const dayStr     = resetDate.toDateString() === tomorrow.toDateString() ? 'فردا ساعت ' : 'امروز ساعت ';
          notice.textContent = `⚡ خیام در حال تنظیم است — بازنشینی ${dayStr}${timeStr}`;
        } else {
          notice.textContent = '⚡ حالت استاندارد فعال شد — درس ادامه دارد';
        }
        document.getElementById('messages').appendChild(notice);
      }

      appendBubble('ai', data.reply);
      chatHistory.push({role:'assistant', content:data.reply});

    } catch(err) {
      removeTyping();
      appendBubble('ai', 'خطایی رخ داد. لطفاً دوباره امتحان کنید.');
    }
  }

  // ── COMPLETE TOPIC ──
  async function completeTopic() {
    if (!currentUser || !currentTopic) return;
    try {
      const res  = await fetch('/api/tutor/complete-topic', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          subject:   currentSubject,
          topic_key: currentTopic.key,
          level:     currentLevel
        })
      });
      const data = await res.json();

      if (data.xp_earned > 0) {
        updateXPBar(data.total_xp);
        showXPPopup(data.xp_earned);
      }

      appendSystemNote(`✓ موضوع "${currentTopic.title}" کامل شد! +${data.xp_earned} XP`);

      // reload progress
      const progRes  = await fetch(`/api/tutor/progress/${currentSubject}`);
      const progData = await progRes.json();
      userProgress[currentSubject] = progData;

    } catch(e) {
      console.error(e);
    }
  }

  // ── QUIZ ──
  async function startQuiz(level) {
    currentLevel = level;
    showScreen('quiz');
    document.getElementById('quiz-card').innerHTML = `
      <div style="text-align:center;padding:40px;color:var(--text-dim);">
        <div style="font-size:32px;margin-bottom:12px;">📝</div>
        در حال ساخت کوییز...
      </div>`;

    try {
      const res  = await fetch('/api/tutor/generate-quiz', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({subject:currentSubject, level})
      });
      const data = await res.json();

      if (data.error || !data.questions) {
        document.getElementById('quiz-card').innerHTML =
          '<div style="text-align:center;padding:40px;color:var(--red-lt);">خطا در ساخت کوییز. دوباره امتحان کنید.</div>';
        return;
      }

      quizQuestions = data.questions;
      quizCurrent   = 0;
      quizScore     = 0;
      renderQuizQuestion();

    } catch(e) {
      console.error(e);
    }
  }

  function renderQuizQuestion() {
    if (quizCurrent >= quizQuestions.length) {
      renderQuizResult();
      return;
    }

    const q   = quizQuestions[quizCurrent];
    const pct = Math.round((quizCurrent / quizQuestions.length) * 100);

    document.getElementById('quiz-card').innerHTML = `
      <div class="quiz-progress">
        <div class="quiz-progress-text">
          <span>سوال ${quizCurrent + 1} از ${quizQuestions.length}</span>
          <span>${pct}%</span>
        </div>
        <div class="quiz-progress-track">
          <div class="quiz-progress-fill" style="width:${pct}%"></div>
        </div>
      </div>

      <div class="quiz-question">${q.q}</div>

      <div class="quiz-options" id="quiz-options">
        ${q.options.map((opt, i) => `
          <button class="quiz-option" onclick="answerQuiz(${i})" data-idx="${i}">
            ${opt}
          </button>
        `).join('')}
      </div>

      <div class="quiz-explanation" id="quiz-explanation">
        💡 ${q.explanation}
      </div>

      <button class="quiz-next-btn" id="quiz-next" onclick="nextQuestion()">
        ${quizCurrent + 1 < quizQuestions.length ? 'سوال بعدی →' : 'نتیجه را ببین →'}
      </button>
    `;
  }

  function answerQuiz(idx) {
    if (quizAnswered) return;
    quizAnswered = true;

    const q       = quizQuestions[quizCurrent];
    const options = document.querySelectorAll('.quiz-option');

    options.forEach(opt => opt.classList.add('answered'));

    if (idx === q.correct) {
      options[idx].classList.add('correct');
      quizScore++;
    } else {
      options[idx].classList.add('wrong');
      options[q.correct].classList.add('correct');
    }

    document.getElementById('quiz-explanation').classList.add('visible');
    document.getElementById('quiz-next').classList.add('visible');
  }

  function nextQuestion() {
    quizAnswered = false;
    quizCurrent++;
    renderQuizQuestion();
  }

  async function renderQuizResult() {
    const score   = Math.round((quizScore / quizQuestions.length) * 100);
    const passed  = score >= 70;
    let xpEarned  = 0;

    // submit result
    if (currentUser) {
      try {
        const res  = await fetch('/api/tutor/submit-quiz', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            subject: currentSubject,
            level:   currentLevel,
            score
          })
        });
        const data = await res.json();
        xpEarned   = data.xp_earned || 0;
        updateXPBar(data.total_xp);
        if (xpEarned > 0) showXPPopup(xpEarned);

        // reload progress
        const progRes  = await fetch(`/api/tutor/progress/${currentSubject}`);
        const progData = await progRes.json();
        userProgress[currentSubject] = progData;
      } catch(e) {}
    }

    document.getElementById('quiz-card').innerHTML = `
      <div class="quiz-result">
        <div class="quiz-score-big">${score}%</div>
        <div class="quiz-score-label">${passed ? '🎉 آفرین! قبول شدی!' : '😊 دوباره امتحان کن!'}</div>
        ${xpEarned > 0 ? `<div class="quiz-xp-earned">+${xpEarned} XP کسب کردی ⚡</div>` : ''}
        <div class="quiz-actions">
          ${passed
            ? `<button class="quiz-action-btn btn-primary" onclick="showScreen('topic')">ادامه درس →</button>`
            : `<button class="quiz-action-btn btn-primary" onclick="startQuiz(${currentLevel})">دوباره امتحان بده</button>`
          }
          <button class="quiz-action-btn btn-secondary" onclick="showScreen('topic')">بازگشت به موضوعات</button>
        </div>
      </div>
    `;
  }

  // ── PLACEMENT TEST ──
  async function startPlacementTest() {
    document.getElementById('btn-placement').classList.add('active');
    document.getElementById('btn-browse').classList.remove('active');

    const container = document.getElementById('levels-container');
    container.innerHTML = `
      <div style="text-align:center;padding:40px;color:var(--text-dim);">
        <div style="font-size:32px;margin-bottom:12px;">🎯</div>
        در حال ساخت تست سطح‌بندی...
      </div>`;

    try {
      const res  = await fetch('/api/tutor/placement-test', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({subject:currentSubject})
      });
      const data = await res.json();

      // use quiz UI for placement test
      quizQuestions = data.questions;
      quizCurrent   = 0;
      quizScore     = 0;

      // show quiz screen but handle result differently
      showScreen('quiz');
      renderPlacementQuestion();

    } catch(e) {
      container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--red-lt);">خطا. دوباره امتحان کنید.</div>';
    }
  }

  let placementAnswers = [];

  function renderPlacementQuestion() {
    if (quizCurrent >= quizQuestions.length) {
      renderPlacementResult();
      return;
    }

    const q   = quizQuestions[quizCurrent];
    const pct = Math.round((quizCurrent / quizQuestions.length) * 100);

    document.getElementById('quiz-card').innerHTML = `
      <div style="text-align:center;margin-bottom:16px;font-size:13px;color:var(--gold);">🎯 تست سطح‌بندی</div>
      <div class="quiz-progress">
        <div class="quiz-progress-text">
          <span>سوال ${quizCurrent + 1} از ${quizQuestions.length}</span>
          <span>سطح ${q.level}</span>
        </div>
        <div class="quiz-progress-track">
          <div class="quiz-progress-fill" style="width:${pct}%"></div>
        </div>
      </div>
      <div class="quiz-question">${q.q}</div>
      <div class="quiz-options" id="quiz-options">
        ${q.options.map((opt, i) => `
          <button class="quiz-option" onclick="answerPlacement(${i})" data-idx="${i}">${opt}</button>
        `).join('')}
      </div>
      <div class="quiz-explanation" id="quiz-explanation">💡 ${q.explanation}</div>
      <button class="quiz-next-btn" id="quiz-next" onclick="nextPlacement()">
        ${quizCurrent + 1 < quizQuestions.length ? 'سوال بعدی →' : 'نتیجه را ببین →'}
      </button>
    `;
  }

  function answerPlacement(idx) {
    if (quizAnswered) return;
    quizAnswered = true;
    const q = quizQuestions[quizCurrent];
    const options = document.querySelectorAll('.quiz-option');
    options.forEach(o => o.classList.add('answered'));
    const correct = idx === q.correct;
    options[idx].classList.add(correct ? 'correct' : 'wrong');
    if (!correct) options[q.correct].classList.add('correct');
    placementAnswers.push({correct, level: q.level});
    document.getElementById('quiz-explanation').classList.add('visible');
    document.getElementById('quiz-next').classList.add('visible');
  }

  function nextPlacement() {
    quizAnswered = false;
    quizCurrent++;
    renderPlacementQuestion();
  }

  async function renderPlacementResult() {
    try {
      const res  = await fetch('/api/tutor/placement-result', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({subject:currentSubject, answers:placementAnswers})
      });
      const data = await res.json();
      const rec  = data.recommended_level;
      const levelName = curriculum[currentSubject].levels[rec].title;

      document.getElementById('quiz-card').innerHTML = `
        <div class="quiz-result">
          <div style="font-size:48px;margin-bottom:12px;">🎯</div>
          <div class="quiz-score-big" style="font-size:40px;">سطح ${rec}</div>
          <div class="quiz-score-label">${levelName}</div>
          <div style="font-size:14px;color:var(--text-dim);margin-bottom:24px;line-height:1.8;">
            بر اساس پاسخ‌های تو، پیشنهاد می‌کنیم از سطح ${rec} شروع کنی.
          </div>
          <div class="quiz-actions">
            <button class="quiz-action-btn btn-primary" onclick="startFromLevel(${rec})">
              از سطح ${rec} شروع کن →
            </button>
            <button class="quiz-action-btn btn-secondary" onclick="showScreen('topic')">
              خودم انتخاب می‌کنم
            </button>
          </div>
        </div>
      `;
    } catch(e) {
      showScreen('topic');
    }
  }

  function startFromLevel(level) {
    showScreen('topic');
    // scroll to that level
    setTimeout(() => {
      const sections = document.querySelectorAll('.level-section');
      if (sections[level - 1]) {
        sections[level - 1].scrollIntoView({behavior:'smooth'});
      }
    }, 100);
  }

  function setBrowseMode(mode) {
    document.getElementById('btn-browse').classList.toggle('active', mode === 'browse');
    document.getElementById('btn-placement').classList.toggle('active', mode === 'placement');
    if (mode === 'browse') renderTopics();
  }

  // ── HELPERS ──
  function scrollToBottom() {
    const w = document.getElementById('chat-wrapper');
    if (w) w.scrollTop = w.scrollHeight;
  }

  function appendBubble(role, text) {
    const messagesEl = document.getElementById('messages');
    const div        = document.createElement('div');
    div.className    = `message ${role}`;
    const avatar     = document.createElement('div');
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === 'ai' ? 'استاد' : '👤';
    const bubble     = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = role === 'ai' ? marked.parse(text) : text;
    div.appendChild(avatar);
    div.appendChild(bubble);
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function showTyping() {
    const messagesEl = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'message ai';
    div.id = 'typing-indicator';
    const avatar = document.createElement('div');
    avatar.className = 'avatar ai';
    avatar.textContent = 'استاد';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    div.appendChild(avatar);
    div.appendChild(bubble);
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function removeTyping() {
    const t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  // ── INPUT ──
  const inputEl = document.getElementById('user-input');
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  init();
</script>
</body>
</html>
