<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تایید ایمیل — خیام</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Vazirmatn', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    nav {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 56px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .logo-mark {
      width: 30px; height: 30px; border: 1.5px solid var(--gold);
      border-radius: 7px; display: flex; align-items: center;
      justify-content: center; font-size: 14px; font-weight: 700; color: var(--gold);
    }
    .logo-text { font-size: 16px; font-weight: 700; color: var(--gold); }
    .page {
      position: relative; z-index: 1; flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 16px;
    }
    .card {
      width: 100%; max-width: 420px; text-align: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 40px 32px;
      animation: fadeUp 0.5s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
    h1.success { color: var(--gold); }
    h1.failed  { color: var(--red-lt); }
    p { font-size: 14px; color: var(--text-dim); line-height: 1.8; margin-bottom: 24px; }
    .btn {
      display: inline-block; padding: 11px 28px; border-radius: 9px;
      background: var(--gold); color: #0f0e0c; text-decoration: none;
      font-size: 14px; font-weight: 700;
    }
    .btn:hover { background: #e0bb60; }
    .btn-secondary {
      display: inline-block; padding: 11px 28px; border-radius: 9px;
      border: 1px solid var(--border); color: var(--text-dim); text-decoration: none;
      font-size: 14px; margin-right: 8px;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo">
      <div class="logo-mark">خ</div>
      <span class="logo-text">خیام</span>
    </a>
  </nav>

  <div class="page">
    <div class="card">
      {% if success %}
        <h1 class="success">ایمیل شما تایید شد</h1>
        <p>حساب شما تایید شده و آماده استفاده است.</p>
        <a href="/chat" class="btn">رفتن به چت ←</a>
      {% else %}
        <h1 class="failed">لینک نامعتبر یا منقضی شده</h1>
        <p>این لینک تایید دیگر کار نمی‌کند. اگر حساب کاربری دارید، از صفحه پروفایل یک لینک تازه درخواست کنید.</p>
        <a href="/profile" class="btn-secondary">پروفایل</a>
        <a href="/login" class="btn">ورود ←</a>
      {% endif %}
    </div>
  </div>
</body>
</html>
