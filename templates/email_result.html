
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>تأیید حساب — خیام</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/khayyam.css?v=20261020">
  <link rel="stylesheet" href="/static/auth.css?v=20261020">
</head>
<body class="auth-body">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="mark" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 34V19C8 10.5 13 6 20 6s12 4.5 12 13v15"/><path d="M14 34V21c0-4 2.5-6.5 6-6.5s6 2.5 6 6.5v13"/><path d="M6 34h28"/></g></symbol></svg>
  <div class="auth-bg" aria-hidden="true"></div>
  <nav class="auth-nav">
    <a href="/" class="logo">
      <svg class="logo-mark" aria-hidden="true"><use href="#mark"/></svg>
      <span class="logo-text">خیام</span>
    </a>
    <a href="/login" class="auth-nav-link">ورود</a>
  </nav>

  <main class="auth-main">
    <section class="auth-card">
      <div class="auth-heading">
        <div class="auth-icon" aria-hidden="true">
          {% if success %}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>{% else %}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5M12 16.5v.01"/><circle cx="12" cy="12" r="9"/></svg>{% endif %}
        </div>
        <h1>
          {% if success %}
            ایمیل تأیید شد
          {% else %}
            تأیید ایمیل
          {% endif %}
        </h1>
        <p>{{ message }}</p>
      </div>

      <div class="auth-actions">
        {% if success %}
        <a href="/login" class="auth-button"
           style="text-align:center;text-decoration:none">
          ورود به حساب
        </a>
        {% else %}
        <a href="/check-email" class="auth-button"
           style="text-align:center;text-decoration:none">
          درخواست لینک جدید
        </a>
        {% endif %}
      </div>
    </section>
  </main>
</body>
</html>
