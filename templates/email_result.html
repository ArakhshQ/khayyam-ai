
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>تأیید حساب — خیام</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body class="auth-body">
  <nav class="auth-nav">
    <a href="/" class="logo">
      <span class="logo-mark">خ</span>
      <span class="logo-text">خیام</span>
    </a>
    <a href="/login" class="auth-nav-link">ورود</a>
  </nav>

  <main class="auth-main">
    <section class="auth-card">
      <div class="auth-heading">
        <div class="auth-icon" aria-hidden="true">
          {% if success %}✓{% else %}!{% endif %}
        </div>
        <h1>
          {% if success %}
            ایمیل تأیید شد
          {% else %}
            تأیید ایمیل
          {% endif %}
        </h1>
        <p>{{ message }}</p>
      </div>

      <div class="auth-actions">
        {% if success %}
        <a href="/login" class="auth-button"
           style="text-align:center;text-decoration:none">
          ورود به حساب
        </a>
        {% else %}
        <a href="/check-email" class="auth-button"
           style="text-align:center;text-decoration:none">
          درخواست لینک جدید
        </a>
        {% endif %}
      </div>
    </section>
  </main>
</body>
</html>
