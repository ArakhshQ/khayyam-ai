
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>تأیید ایمیل — خیام</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body class="auth-body">
  <nav class="auth-nav">
    <a href="/" class="logo">
      <span class="logo-mark">خ</span>
      <span class="logo-text">خیام</span>
    </a>
    <a href="/login" class="auth-nav-link">ورود</a>
  </nav>

  <main class="auth-main">
    <section class="auth-card">
      <div class="auth-heading">
        <div class="auth-icon" aria-hidden="true">✉</div>
        <h1>ایمیل خود را بررسی کنید</h1>
        <p>
          لینک تأیید حساب خیام برای ایمیل شما ارسال شده است.
          صندوق ورودی و پوشه هرزنامه را بررسی کنید.
        </p>
      </div>

      <div id="notice" class="auth-notice"
           role="status" aria-live="polite"></div>

      <form id="resend-form">
        <div class="auth-field">
          <label class="auth-label" for="email">
            آدرس ایمیل
          </label>
          <input class="auth-input" id="email"
                 type="email" autocomplete="email"
                 placeholder="example@gmail.com"
                 required>
        </div>

        <button class="auth-button auth-button-secondary"
                id="resend-btn" type="submit">
          ارسال دوباره ایمیل تأیید
        </button>
      </form>

      <div class="auth-divider"></div>
      <p class="auth-note">
        لینک تأیید تا ۲۴ ساعت اعتبار دارد.
        اگر ایمیلی دریافت نکردید، کمی صبر کنید و دوباره تلاش کنید.
      </p>

      <div class="auth-footer">
        <a href="/login">بازگشت به صفحه ورود</a>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('resend-form');
    const button = document.getElementById('resend-btn');
    const notice = document.getElementById('notice');

    form.addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = 'در حال ارسال...';

      try {
        const response = await fetch('/api/resend-verification', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            email: document.getElementById('email').value.trim()
          })
        });

        const data = await response.json();
        notice.textContent = data.message ||
          data.error || 'درخواست انجام نشد.';
        notice.className = 'auth-notice visible ' +
          (response.ok ? 'success' : 'error');
      } catch (error) {
        notice.textContent = 'ارتباط با سرور برقرار نشد.';
        notice.className = 'auth-notice visible error';
      } finally {
        button.disabled = false;
        button.textContent = 'ارسال دوباره ایمیل تأیید';
      }
    });
  </script>
</body>
</html>
